# Packaging (docs/04 §3, docs/06 §8). Run from packages/app after `npm run build` at the root.
appId: dev.advpipe.app
productName: advpipe
executableName: advpipe
artifactName: advpipe-${version}-${os}-${arch}.${ext}
directories:
  output: ../../release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Run outside the asar: the worker (spawned as `<app> worker.js`) and its prompts, and every
# runtime dependency. The worker resolves its imports (zod, the Agent SDK and its peers) from
# app.asar.unpacked/node_modules, which can't see into the asar; and the SDK's native Claude Code
# binary can't be spawned from inside one either.
asarUnpack:
  - out/main/**
  - node_modules/**
npmRebuild: false
# Nothing is published from here: the owner uploads installers by hand.
publish: null
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: advpipe <advpipe@localhost>
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
